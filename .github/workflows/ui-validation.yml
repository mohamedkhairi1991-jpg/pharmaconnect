name: UI validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Flutter UI scope
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Report Flutter version
        run: flutter --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run scoped UI validation
        id: ui-validation
        shell: bash
        run: |
          set -euo pipefail
          {
            bash tool/validate_ui_phase.sh --mode design-system
            bash tool/validate_ui_phase.sh --mode auth-ui
            bash tool/validate_ui_phase.sh --mode doctor-catalog-ui
            bash tool/validate_ui_phase.sh --mode company-catalog-ui
            bash tool/validate_ui_phase.sh --mode admin-review-ui
          } 2>&1 | tee ui-validation.log

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-validation-log
          path: ui-validation.log
          if-no-files-found: warn
          retention-days: 7
